# Pull Request Pipeline - Build and test only
when:
  - event: pull_request

labels:
  platform: linux/amd64

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      depth: 50

steps:
  # Validate commit messages follow conventional commits
  - name: commitlint
    image: node:22-alpine
    commands:
      # node:22-alpine ships without git. Without this the git log below fails, the
      # loop reads nothing, and the step reports success having checked nothing.
      - apk add --no-cache git
      - npm install -g @commitlint/cli @commitlint/config-conventional
      - |
        echo "module.exports = { extends: ['@commitlint/config-conventional'] };" > commitlint.config.js
      - |
        set -eu

        git rev-parse --verify origin/main >/dev/null 2>&1 || git fetch -q origin main

        BASE=$(git merge-base origin/main HEAD)
        git log --format=%s "$BASE"..HEAD > /tmp/commit-subjects

        COUNT=$(wc -l < /tmp/commit-subjects | tr -d ' ')
        if [ "$COUNT" -eq 0 ]; then
          echo "No commits found between origin/main and HEAD; refusing to report success"
          exit 1
        fi

        echo "Checking $COUNT commit subject(s)"

        # Read from a file rather than a pipe so the failure flag survives the loop,
        # and report every bad subject instead of stopping at the first.
        FAILED=0
        while IFS= read -r msg; do
          echo "Checking: $msg"
          echo "$msg" | commitlint || FAILED=1
        done < /tmp/commit-subjects

        if [ "$FAILED" -ne 0 ]; then
          echo "One or more commit subjects are not conventional commits"
          exit 1
        fi

        echo "All commits follow conventional commit format"

  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet restore
      - dotnet build -c Release
      - dotnet test -c Release --logger "console;verbosity=detailed"
    depends_on: [commitlint]

  # Fail the PR if any package, direct or transitive, has a known advisory.
  - name: vulnerability-audit
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      DOTNET_CLI_UI_LANGUAGE: en
    commands:
      - |
        set +e
        OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
        STATUS=$?
        set -e
        echo "$OUTPUT"

        # Fail closed: a command that could not complete is not a clean audit.
        if [ "$STATUS" -ne 0 ]; then
          echo "dotnet list package did not complete cleanly (exit $STATUS); treating as a failed audit"
          exit 1
        fi

        # Match only the phrasing used when something is actually vulnerable. A clean
        # run prints "has no vulnerable packages given the current sources", so a looser
        # match on "vulnerable packages" reports a finding on every green build.
        if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
          echo "Vulnerable NuGet packages detected"
          exit 1
        fi

        echo "No known vulnerable packages"
    depends_on: [commitlint]
