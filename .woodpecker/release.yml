# Release Pipeline - Build, test, version, package, release, GitOps deploy
#
# Required Woodpecker secrets:
#   github_username -> GHCR username
#   github_token    -> GHCR token and GitHub token with write access to barryw/ImmichMCP
#                    and barryw/infrastructure
when:
  - event: push
    branch: main

labels:
  platform: linux/amd64

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      lfs: false
      partial: false
      tags: true

steps:
  # Determine next version based on conventional commits
  - name: calculate-version
    image: alpine
    commands:
      - apk add --no-cache git
      - |
        set -e

        # Ensure we have all tags and history
        echo "=== Fetching tags and history ==="
        git fetch --tags --unshallow 2>/dev/null || git fetch --tags || true
        git fetch origin main --unshallow 2>/dev/null || git fetch origin main || true

        echo "=== Git log (last 10 commits) ==="
        git log --oneline -10

        echo "=== All tags ==="
        git tag -l

        # Get latest tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "=== Latest tag: $LATEST_TAG ==="

        # Parse current version
        VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)
        PATCH=$(echo "$VERSION" | cut -d. -f3)
        echo "Current version: $MAJOR.$MINOR.$PATCH"

        # Get commits since last tag
        if [ "$LATEST_TAG" = "v0.0.0" ]; then
          COMMITS=$(git log --pretty=format:"%s" HEAD)
        else
          COMMITS=$(git log --pretty=format:"%s" "$LATEST_TAG..HEAD")
        fi

        echo "=== Commits since last tag ==="
        echo "$COMMITS"
        echo "=== End commits ==="

        # Check if COMMITS is empty
        if [ -z "$COMMITS" ]; then
          echo "No commits found since last tag"
          echo "none" > .bump-type
          exit 0
        fi

        # Determine bump type from conventional commits
        BUMP="none"

        # Check for breaking changes (major bump)
        if echo "$COMMITS" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE:'; then
          BUMP="major"
          echo "Found breaking change commit"
        # Check for features (minor bump)
        elif echo "$COMMITS" | grep -qE '^feat(\(.+\))?:'; then
          BUMP="minor"
          echo "Found feat commit"
        # Check for fixes or other conventional commits (patch bump)
        elif echo "$COMMITS" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test)(\(.+\))?:'; then
          BUMP="patch"
          echo "Found fix/patch commit"
        fi

        echo "=== Bump type: $BUMP ==="

        # Exit if no version bump needed
        if [ "$BUMP" = "none" ]; then
          echo "No conventional commits found, skipping version bump"
          echo "none" > .bump-type
          exit 0
        fi

        # Calculate new version
        case $BUMP in
          major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
          patch) PATCH=$((PATCH + 1)) ;;
        esac

        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        PROJECT_VERSION=$(sed -n 's#.*<Version>\([^<]*\)</Version>.*#\1#p' ImmichMCP/ImmichMCP.csproj | head -1)
        if [ -n "$PROJECT_VERSION" ]; then
          PROJECT_MAJOR=$(echo "$PROJECT_VERSION" | cut -d. -f1)
          PROJECT_MINOR=$(echo "$PROJECT_VERSION" | cut -d. -f2)
          PROJECT_PATCH=$(echo "$PROJECT_VERSION" | cut -d. -f3)

          if [ "$PROJECT_MAJOR" -gt "$MAJOR" ] ||
             { [ "$PROJECT_MAJOR" -eq "$MAJOR" ] && [ "$PROJECT_MINOR" -gt "$MINOR" ]; } ||
             { [ "$PROJECT_MAJOR" -eq "$MAJOR" ] && [ "$PROJECT_MINOR" -eq "$MINOR" ] && [ "$PROJECT_PATCH" -gt "$PATCH" ]; }; then
            echo "Project version floor $PROJECT_VERSION is newer than calculated $NEW_VERSION; using $PROJECT_VERSION"
            NEW_VERSION="$PROJECT_VERSION"
          fi
        fi

        echo "New version: $NEW_VERSION"

        # Write version files for subsequent steps
        echo "$NEW_VERSION" > .version
        echo "v$NEW_VERSION" > .tag
        echo "$BUMP" > .bump-type

        # Update version.json
        echo "{\"version\": \"$NEW_VERSION\"}" > version.json

        cat .version
        cat .tag

  # Build and test with the new version
  - name: build-and-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - |
        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, building with current version"
          dotnet restore
          dotnet build -c Release
          dotnet test -c Release --logger "console;verbosity=detailed"
        else
          VERSION=$(cat .version)
          echo "Building version $VERSION"
          dotnet restore
          dotnet build -c Release /p:Version=$VERSION
          dotnet test -c Release /p:Version=$VERSION --logger "console;verbosity=detailed"
        fi
    depends_on: [calculate-version]

  # Package NuGet
  - name: package
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - |
        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping package"
          exit 0
        fi

        VERSION=$(cat .version)
        echo "Packaging version $VERSION"
        dotnet pack ImmichMCP/ImmichMCP.csproj -c Release -o ./artifacts /p:Version=$VERSION
        ls -la ./artifacts/
    depends_on: [build-and-test]

  # Optional read-only integration tests against the existing in-cluster Immich server.
  - name: integration-test
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      IMMICH_BASE_URL: http://immich-server.default.svc.cluster.local:2283
      IMMICH_INTEGRATION_EXPECTED_MAJOR: "3"
    commands:
      - |
        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping integration tests"
          exit 0
        fi

        if [ -z "${IMMICH_API_KEY:-}" ]; then
          echo "IMMICH_API_KEY is not injected into this runner; skipping direct Immich API integration tests"
          exit 0
        fi

        export IMMICH_INTEGRATION_TESTS=true
        dotnet test ImmichMCP.Tests/ImmichMCP.Tests.csproj \
          -c Release \
          --no-restore \
          --filter "Category=Integration" \
          --logger "console;verbosity=detailed"
    depends_on: [build-and-test]

  # Build and push Docker with Kaniko
  - name: docker
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_USERNAME:
        from_secret: github_username
      GHCR_TOKEN:
        from_secret: github_token
    commands:
      - |
        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping docker build"
          exit 0
        fi

        VERSION=$(cat .version)
        echo "Building Docker image version: $VERSION"
        mkdir -p /kaniko/.docker
        echo "{\"auths\":{\"ghcr.io\":{\"username\":\"$GHCR_USERNAME\",\"password\":\"$GHCR_TOKEN\"}}}" > /kaniko/.docker/config.json
        /kaniko/executor \
          --context="$CI_WORKSPACE" \
          --dockerfile="$CI_WORKSPACE/Dockerfile" \
          --destination="ghcr.io/barryw/immichmcp:v$VERSION" \
          --destination="ghcr.io/barryw/immichmcp:latest" \
          --build-arg="VERSION=$VERSION"
    depends_on: [integration-test]

  # Commit version.json, create git tag and push
  - name: git-tag
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping git tag"
          exit 0
        fi

        TAG=$(cat .tag)
        VERSION=$(cat .version)
        echo "Creating tag $TAG for version $VERSION"

        git config user.email "ci@woodpecker.local"
        git config user.name "Woodpecker CI"
        git remote set-url origin "https://x-access-token:$GITHUB_TOKEN@github.com/barryw/ImmichMCP.git"

        # Commit version.json update. On a restart main already carries the bump,
        # so pushing this pipeline's older HEAD would be a non-fast-forward.
        git add version.json
        if git diff --staged --quiet; then
          echo "version.json already at $VERSION; nothing to commit"
        else
          git commit -m "chore(release): bump version to $VERSION [skip ci]"
          git push origin HEAD:main
        fi

        # Create and push tag. Restarting a run that already tagged must not abort
        # the pipeline before the deploy and verification steps get to run again.
        if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null ||
           git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
          echo "Tag $TAG already exists; skipping tag creation"
        else
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"
        fi
    depends_on: [package, docker]

  # Create GitHub release
  - name: release
    image: alpine
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - |
        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping release"
          exit 0
        fi

        apk add --no-cache curl git jq

        TAG=$(cat .tag)
        VERSION=$(cat .version)
        LATEST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "v0.0.0")

        # POSTing a release for a tag that already has one returns 422 and would
        # fail the run, so a restart must treat an existing release as done.
        if curl -fsS \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/barryw/ImmichMCP/releases/tags/$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists; skipping"
          exit 0
        fi

        echo "Creating GitHub release for $TAG"

        # Generate changelog from commits
        if [ "$LATEST_TAG" = "v0.0.0" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s" HEAD | head -20)
        else
          CHANGELOG=$(git log --pretty=format:"- %s" "$LATEST_TAG..HEAD^" | head -20)
        fi

        BODY=$(printf "## What's Changed\n\n%s\n\n**Full Changelog**: https://github.com/barryw/ImmichMCP/compare/%s...%s" "$CHANGELOG" "$LATEST_TAG" "$TAG")
        PAYLOAD=$(jq -n \
          --arg tag "$TAG" \
          --arg name "Release $VERSION" \
          --arg body "$BODY" \
          '{tag_name:$tag,name:$name,body:$body,draft:false,prerelease:false}')

        curl -fsS -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/barryw/ImmichMCP/releases \
          -d "$PAYLOAD"
    depends_on: [git-tag]

  # Deploy by updating the Argo-managed infrastructure repo.
  - name: update-gitops
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INFRA_REPO: barryw/infrastructure
      INFRA_BRANCH: main
      INFRA_MANIFEST: kubernetes-default/immich/resources.yaml
    commands:
      - |
        set -eu
        apk add --no-cache curl jq

        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping GitOps update"
          exit 0
        fi

        VERSION=$(cat .version)
        IMAGE="ghcr.io/barryw/immichmcp:v$VERSION"
        DEPLOY_BRANCH="ci/immichmcp-v$VERSION"
        echo "Publishing GitOps deploy for $IMAGE"

        git clone "https://x-access-token:$GITHUB_TOKEN@github.com/$INFRA_REPO.git" infrastructure
        cd infrastructure

        git config user.email "ci@woodpecker.local"
        git config user.name "Woodpecker CI"
        git checkout -B "$DEPLOY_BRANCH"

        sed -i "s#image: ghcr.io/barryw/immichmcp:.*#image: $IMAGE#" "$INFRA_MANIFEST"

        awk '
          BEGIN { in_immich_mcp = 0; inserted = 0; skip_tool_mode = 0 }
          /^---$/ { in_immich_mcp = 0 }
          /^  name: immich-mcp$/ { in_immich_mcp = 1 }
          in_immich_mcp && $0 ~ /^[[:space:]]+- name: IMMICH_TOOL_MODE$/ {
            skip_tool_mode = 1
            next
          }
          skip_tool_mode && $0 ~ /^[[:space:]]+value: / {
            skip_tool_mode = 0
            next
          }
          {
            print
            if (in_immich_mcp && !inserted && $0 ~ /^[[:space:]]+- name: MCP_PUBLIC_URL$/) {
              if ((getline next_line) > 0) {
                print next_line
                print "            - name: IMMICH_TOOL_MODE"
                print "              value: gateway"
                inserted = 1
                next
              }
            }
          }
          END { if (!inserted) exit 2 }
        ' "$INFRA_MANIFEST" > "$INFRA_MANIFEST.tmp"
        mv "$INFRA_MANIFEST.tmp" "$INFRA_MANIFEST"

        grep -q "image: $IMAGE" "$INFRA_MANIFEST"
        grep -A2 'name: MCP_PUBLIC_URL' "$INFRA_MANIFEST" | grep -q 'name: IMMICH_TOOL_MODE'
        grep -A1 'name: IMMICH_TOOL_MODE' "$INFRA_MANIFEST" | grep -q 'value: gateway'

        if git diff --quiet -- "$INFRA_MANIFEST"; then
          echo "Infrastructure manifest already points at $IMAGE"
          exit 0
        fi

        git diff -- "$INFRA_MANIFEST"
        git add "$INFRA_MANIFEST"
        git commit -m "chore(immich): deploy immichmcp v$VERSION"
        git push --force-with-lease origin "$DEPLOY_BRANCH"

        INFRA_OWNER=$(echo "$INFRA_REPO" | cut -d/ -f1)
        PR_TITLE="chore(immich): deploy immichmcp v$VERSION"
        PR_BODY=$(printf "Deploys %s through the Argo-managed immich application.\n\nWoodpecker release: %s" "$IMAGE" "$VERSION")

        EXISTING_PR=$(curl -fsS \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$INFRA_REPO/pulls?head=$INFRA_OWNER:$DEPLOY_BRANCH&base=$INFRA_BRANCH&state=open" \
          | jq -r '.[0].number // empty')

        if [ -n "$EXISTING_PR" ]; then
          PR_NUMBER="$EXISTING_PR"
          PR_URL="https://github.com/$INFRA_REPO/pull/$PR_NUMBER"
          echo "Reusing infrastructure PR $PR_URL"
        else
          PR_PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg head "$DEPLOY_BRANCH" \
            --arg base "$INFRA_BRANCH" \
            --arg body "$PR_BODY" \
            '{title:$title,head:$head,base:$base,body:$body}')

          PR_RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$INFRA_REPO/pulls" \
            -d "$PR_PAYLOAD")
          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')
          PR_URL=$(echo "$PR_RESPONSE" | jq -r '.html_url')
          echo "Created infrastructure PR $PR_URL"
        fi

        MERGE_PAYLOAD=$(jq -n \
          --arg title "$PR_TITLE" \
          --arg message "Deploy $IMAGE for Immich v3 gateway support." \
          '{commit_title:$title,commit_message:$message,merge_method:"squash"}')

        if curl -fsS -X PUT \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$INFRA_REPO/pulls/$PR_NUMBER/merge" \
          -d "$MERGE_PAYLOAD"; then
          git push origin --delete "$DEPLOY_BRANCH" || true
        else
          echo "Infrastructure PR $PR_URL could not be merged automatically; Argo will reconcile after it is merged."
          exit 1
        fi

        echo "GitOps deploy PR merged. ArgoCD will reconcile the immich app from $INFRA_REPO@$INFRA_BRANCH."
    depends_on: [release]

  # Verify Argo reconciled the GitOps commit by testing the in-cluster MCP service.
  - name: verify-gitops-deploy
    image: mcr.microsoft.com/dotnet/sdk:10.0
    environment:
      IMMICH_MCP_INTEGRATION_TESTS: "true"
      IMMICH_MCP_BASE_URL: http://immich-mcp.default.svc.cluster.local:5000/mcp
    commands:
      - |
        set -eu

        BUMP_TYPE=$(cat .bump-type)
        if [ "$BUMP_TYPE" = "none" ]; then
          echo "No version bump, skipping GitOps deploy verification"
          exit 0
        fi

        echo "Waiting for ArgoCD to reconcile immich-mcp through GitOps..."
        for attempt in $(seq 1 30); do
          RESULTS_DIR="TestResults/mcp-gateway"
          rm -rf "$RESULTS_DIR"
          if dotnet vstest ImmichMCP.Tests/bin/Release/net10.0/ImmichMCP.Tests.dll \
            --logger:"console;verbosity=normal" \
            --logger:"trx;LogFileName=mcp-gateway.trx" \
            --ResultsDirectory:"$RESULTS_DIR"; then
            if grep -q 'testName="ImmichMCP.Tests.Integration.ImmichMcpGatewayIntegrationTests.GatewayModeEnablesHealthToolsAndPingsImmich"[^>]*outcome="Passed"' "$RESULTS_DIR/mcp-gateway.trx"; then
              echo "GitOps deploy verified through MCP gateway."
              exit 0
            fi

            echo "MCP gateway test did not report a Passed outcome"
          fi

          echo "MCP gateway verification attempt $attempt failed; retrying in 10s"
          sleep 10
        done

        echo "GitOps deploy verification did not pass before timeout"
        exit 1
    depends_on: [update-gitops]
